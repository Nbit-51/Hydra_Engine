name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install CPU test dependencies
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            hydra_config.py \
            hydra_model.py \
            export_to_cpp.py \
            dump_tokenizer.py \
            profile_baseline.py \
            test_models.py

      - name: Run CPU smoke tests
        run: python -m unittest discover -s tests -v

      - name: Verify scalar token matching
        run: |
          g++ -std=c++17 -O2 \
            -Icpp \
            cpp/simd_verify.cpp \
            tests/cpp/test_simd_verify.cpp \
            -o /tmp/hydra-simd-scalar
          /tmp/hydra-simd-scalar | tee /tmp/hydra-simd-scalar.txt
          grep -q 'backend: scalar' /tmp/hydra-simd-scalar.txt

      - name: Verify AVX2 token matching
        if: runner.arch == 'X64'
        run: |
          if ! grep -qw avx2 /proc/cpuinfo; then
            echo 'AVX2 is unavailable on this runner; scalar coverage passed.'
            exit 0
          fi
          g++ -std=c++17 -O2 -mavx2 \
            -Icpp \
            cpp/simd_verify.cpp \
            tests/cpp/test_simd_verify.cpp \
            -o /tmp/hydra-simd-avx2
          /tmp/hydra-simd-avx2 | tee /tmp/hydra-simd-avx2.txt
          grep -q 'backend: avx2' /tmp/hydra-simd-avx2.txt

      - name: Check repository whitespace
        run: git diff --check HEAD^ HEAD
